<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virágkötészet - Maszat felkészítő</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;700&display=swap" rel="stylesheet">
<style>body{background:#FDF8F0;font-family:'Outfit',sans-serif}.font-display{font-family:'Fraunces',serif}.tab-active{background:#2D3A2E;color:white}</style>
</head>
<body class="text-zinc-800">
<header class="bg-[#2D3A2E] text-[#FDF8F0] px-6 py-8">
<div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between gap-6">
<div>
<h1 class="font-display text-4xl md:text-5xl mt-2 leading-[0.95]">Virágkötészet<br><span class="text-[#D47B5E]">Maszat</span> felkészítő</h1>
</div>
<div class="flex gap-2 bg-black/20 p-2 rounded-2xl h-fit self-start flex-wrap">
<button id="btn-m1" onclick="switchModule(1)" class="tab-active px-5 py-3 rounded-xl text-sm font-semibold">1. Virágkötészet</button>
<button id="btn-m2" onclick="switchModule(2)" class="px-5 py-3 rounded-xl text-sm font-semibold bg-white/10 text-white">2. Gazdálkodás</button>
<button id="btn-m3" onclick="switchModule(3)" class="px-5 py-3 rounded-xl text-sm font-semibold bg-white/10 text-white">3. Vizsga</button>
<button id="btn-m4" onclick="switchModule(4)" class="px-5 py-3 rounded-xl text-sm font-semibold bg-white/10 text-white">4. 2025</button>

</div>
</div>
</header>

<main class="max-w-7xl mx-auto px-6 py-8">

<!-- MOD1 VIRAG -->
<section id="mod1">
<div class="flex flex-wrap gap-3 mb-6 justify-between">
<div class="flex gap-2 bg-white p-1.5 rounded-full border shadow-sm">
<button id="m1ListBtn" onclick="switchInner(1,'list')" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white">Kérdések végignézése</button>
<button id="m1PracBtn" onclick="switchInner(1,'practice')" class="px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600">Gyakorlás</button>
</div>
<div class="flex gap-2">
<input id="searchInput1" oninput="renderList(1)" placeholder="Keresés virágkötészetben..." class="px-4 py-2.5 rounded-full border bg-white text-sm w-72">
<select id="filterType1" onchange="renderList(1)" class="px-4 py-2.5 rounded-full border bg-white text-sm"><option value="all">Összes (40)</option><option value="choice">Feleletválasztós</option><option value="tf">Igaz-Hamis</option><option value="multi">Több jó válasz</option></select>
</div>
</div>
<div id="viewList1"><div id="questionList1" class="grid md:grid-cols-2 gap-4"></div></div>
<div id="viewPractice1" class="hidden">
<div class="bg-white rounded-[28px] border p-8 max-w-3xl mx-auto shadow-sm">
<div class="flex justify-between items-center mb-6"><div class="flex items-center gap-3"><span id="pProgressText1" class="text-xs font-bold bg-[#2D3A2E] text-white px-3 py-1.5 rounded-full">1 / 40</span><div class="w-40 h-2 bg-zinc-100 rounded-full overflow-hidden"><div id="pBar1" class="h-full bg-[#8FA998] transition-all" style="width:2%"></div></div></div><div class="text-sm font-semibold"><span id="pScore1">0</span> pont • <span id="pPerc1">0%</span></div></div>
<h3 id="pQuestion1" class="font-display text-xl mb-6"></h3>
<div id="pOptions1" class="grid gap-3"></div>
<div id="pFeedback1" class="hidden mt-6 p-4 rounded-2xl text-sm"></div>
<div class="mt-8 flex justify-between"><button onclick="resetPractice(1)" class="text-sm text-zinc-500 underline">Újrakezdés</button><button id="pNext1" onclick="nextPractice(1)" class="hidden bg-[#2D3A2E] text-white px-6 py-3 rounded-full text-sm font-semibold">Következő →</button></div>
</div>
</div>
</section>

<!-- MOD2 GAZD -->
<section id="mod2" class="hidden">
<div class="flex flex-wrap gap-3 mb-6 justify-between">
<div class="flex gap-2 bg-white p-1.5 rounded-full border shadow-sm">
<button id="m2ListBtn" onclick="switchInner(2,'list')" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white">Kérdések végignézése</button>
<button id="m2PracBtn" onclick="switchInner(2,'practice')" class="px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600">Gyakorlás</button>
</div>
<div class="flex gap-2">
<input id="searchInput2" oninput="renderList(2)" placeholder="Keresés gazdálkodásban..." class="px-4 py-2.5 rounded-full border bg-white text-sm w-72">
<select id="filterType2" onchange="renderList(2)" class="px-4 py-2.5 rounded-full border bg-white text-sm"><option value="all">Összes (40)</option><option value="choice">Feleletválasztós</option><option value="tf">Igaz-Hamis</option></select>
</div>
</div>
<div id="viewList2"><div id="questionList2" class="grid md:grid-cols-2 gap-4"></div></div>
<div id="viewPractice2" class="hidden">
<div class="bg-white rounded-[28px] border p-8 max-w-3xl mx-auto shadow-sm">
<div class="flex justify-between items-center mb-6"><div class="flex items-center gap-3"><span id="pProgressText2" class="text-xs font-bold bg-[#2D3A2E] text-white px-3 py-1.5 rounded-full">1 / 40</span><div class="w-40 h-2 bg-zinc-100 rounded-full overflow-hidden"><div id="pBar2" class="h-full bg-[#D47B5E] transition-all" style="width:2%"></div></div></div><div class="text-sm font-semibold"><span id="pScore2">0</span> pont • <span id="pPerc2">0%</span></div></div>
<h3 id="pQuestion2" class="font-display text-xl mb-6"></h3>
<div id="pOptions2" class="grid gap-3"></div>
<div id="pFeedback2" class="hidden mt-6 p-4 rounded-2xl text-sm"></div>
<div class="mt-8 flex justify-between"><button onclick="resetPractice(2)" class="text-sm text-zinc-500 underline">Újrakezdés</button><button id="pNext2" onclick="nextPractice(2)" class="hidden bg-[#2D3A2E] text-white px-6 py-3 rounded-full text-sm font-semibold">Következő →</button></div>
</div>
</div>
</section>

<!-- MOD3 VIZSGA -->
<section id="mod3" class="hidden">
<div id="examStart" class="bg-white rounded-[28px] border p-10 text-center max-w-2xl mx-auto shadow-sm">
<h2 class="font-display text-3xl">Kombinált vizsga</h2>
<p class="text-zinc-600 mt-3">Válassz vizsgatípust</p>
<div class="mt-6 grid grid-cols-1 md:grid-cols-3 gap-3">
<button onclick="startExam('flower')" class="bg-[#8FA998] text-white p-5 rounded-2xl text-left"><p class="font-bold">Virágkötészet</p><p class="text-sm opacity-80">20 kérdés / 40-ből</p></button>
<button onclick="startExam('econ')" class="bg-[#D47B5E] text-white p-5 rounded-2xl text-left"><p class="font-bold">Gazdálkodás</p><p class="text-sm opacity-80">20 kérdés / 40-ből</p></button>
<button onclick="startExam('all')" class="bg-[#2D3A2E] text-white p-5 rounded-2xl text-left"><p class="font-bold">Komplex</p><p class="text-sm opacity-80">25 kérdés / 80-ból</p></button>
</div>
</div>
<div id="examRunning" class="hidden max-w-3xl mx-auto bg-white rounded-[28px] border p-8 shadow-sm">
<div class="flex justify-between mb-6 text-sm font-semibold"><span id="eProgress" class="bg-zinc-100 px-3 py-1 rounded-full"></span><span id="eScore" class="bg-[#FDF8F0] px-3 py-1 rounded-full border"></span></div>
<h3 id="eQuestion" class="font-display text-xl mb-6"></h3>
<div id="eOptions" class="grid gap-3"></div>
<div id="eFeedback" class="hidden mt-4 p-4 rounded-2xl text-sm"></div>
<button id="eNext" onclick="nextExam()" class="hidden mt-6 bg-[#2D3A2E] text-white px-6 py-3 rounded-full text-sm">Következő</button>
</div>
<div id="examResult" class="hidden max-w-2xl mx-auto bg-white rounded-[28px] border p-10 text-center shadow-sm">
<h2 id="eResultTitle" class="font-display text-3xl"></h2>
<p id="eResultText" class="mt-4 text-zinc-600"></p>
<div id="eResultDetails" class="mt-6 text-left grid gap-2 max-h-[500px] overflow-auto pr-1"></div>
<button onclick="document.getElementById('examResult').classList.add('hidden');document.getElementById('examStart').classList.remove('hidden')" class="mt-8 bg-[#2D3A2E] text-white px-8 py-3 rounded-full">Új vizsga</button>
</div>
</section>


<section id="mod4" class="hidden">
<div class="flex flex-wrap gap-3 mb-6 justify-between">
<div class="flex gap-2 bg-white p-1.5 rounded-full border shadow-sm">
<button id="m4ListBtn" onclick="switchInner2025('list')" class="px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white">Kérdések végignézése (74)</button>
<button id="m4PracBtn" onclick="switchInner2025('practice')" class="px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600">Gyakorlás + kiértékelés</button>
</div>
</div>

<div id="m4viewList"><div id="m4questionList" class="grid gap-4"></div></div>

<div id="m4viewPractice" class="hidden">
<div class="bg-white rounded-[24px] border p-7 md:p-9 max-w-3xl mx-auto shadow-sm">
<div class="flex justify-between items-center mb-5">
<div class="flex items-center gap-3"><span id="m4pText" class="text-xs font-bold bg-[#2D3A2E] text-white px-3 py-1.5 rounded-full">1 / 74</span><div class="w-36 h-2 bg-zinc-100 rounded-full overflow-hidden"><div id="m4pBar" class="h-full bg-[#D47B5E] transition-all" style="width:2%"></div></div></div>
<div class="text-sm font-semibold"><span id="m4pScore">0 pont</span> • <span id="m4pPerc">0%</span></div>
</div>
<h3 id="m4pQuestion" class="font-display text-xl mb-3 leading-snug"></h3>
<div id="m4pImage" class="mb-5"></div>
<div id="m4pOptions" class="grid gap-2.5"></div>
<div id="m4pFeedback" class="hidden mt-5 p-4 rounded-2xl text-sm"></div>
<div class="mt-7 flex justify-between"><button onclick="reset2025()" class="text-xs underline text-zinc-500">Újrakezdés</button><button id="m4pNext" onclick="next2025()" class="hidden bg-[#2D3A2E] text-white px-6 py-3 rounded-full text-sm font-semibold">Következő →</button></div>
</div>
<div id="m4result" class="hidden mt-8 max-w-3xl mx-auto bg-white rounded-[24px] border p-8 text-center">
<h2 id="m4ResultTitle" class="font-display text-3xl"></h2>
<p id="m4ResultText" class="mt-3"></p>
<div id="m4ResultDetails" class="mt-6 text-left grid gap-2 max-h-[420px] overflow-auto"></div>
<button onclick="reset2025()" class="mt-6 bg-[#2D3A2E] text-white px-6 py-3 rounded-full text-sm">Újrakezdés</button>
</div>
</div>
</section>

</main>

<script>
const FLOWER_QUESTIONS=[
{id:1,q:"Válassza ki melyik nem virágkötészeti technika!",opts:["kötött","tűzött","festett","ragasztott","fűzött","beültetéses","vágott"],c:[2],type:"choice",multi:false,note:"A festett nem alap virágkötészeti technika"},
{id:2,q:"Melyek a virágkötészet alapstílusai",opts:["Dekoratív","Vegetatív","Urbánus","Paralel","Vonalas-grafikus","Falusi"],c:[0,1,3,4],type:"multi",multi:true,note:"Alapstílusok: dekoratív, vegetatív, paralel, vonalas-grafikus"},
{id:3,q:"Melyik stílusra igaz: A befogadó forma alárendelt elemévé válnak a legkülönlegesebb virágok is, mert a stílus jellegzetessége a formai kialakítás:",opts:["dekoratív","falusias","paralel"],c:[0],type:"choice",multi:false},
{id:4,q:"Melyik stílusra igaz: Az elrendezés szempontjai, hogy a kompozícióban meghatározott vonalak (függőleges, vízszintes, átlós) érvényesülnek, minden virág a saját habitusával jelenik meg, az elemek közti üres térnek is jelentősége van, ajánlott az arisztokratikus, uralkodó virágok, nagy levelek, egyedi megjelenésű ágak használata:",opts:["Dekoratív","Vonalas-grafikus","Városias"],c:[1],type:"choice"},
{id:5,q:"Válassza ki, hogy az aranymetszés szabálya szerint rendszerint mennyi a kisebbik és a nagyobbik rész arány-értéke!",opts:["2,5","1,2","1,6"],c:[2],type:"choice"},
{id:6,q:"Melyik az aranymetszés leírása",opts:["3:5=5:8","4:6=6:8","3:6=6:9"],c:[0],type:"choice"},
{id:7,q:"Döntse el igaz vagy hamis: A növekedési feltételek (fény, hőmérséklet, páratartalom, tápanyagutánpótlás, növényvédelem) jelentős hatással vannak a vágott virágok szedés utáni minőségére.",opts:["igaz","hamis"],c:[0],type:"tf"},
{id:8,q:"Döntse el: Az értékesítési lánc minden szakaszában a vágott virágot a vízben hypoval érdemes ellátni: termelői, nagykereskedői, virágüzleti és kiskereskedelmi szinten, végül pedig fogyasztói szinten is.",opts:["igaz","hamis"],c:[1],type:"tf",note:"Nem minden szinten hypoval"},
{id:9,q:"Döntse el: A huzat problémát jelent, a vágott virág a nedvességtartalmát gyorsabban párologtatja el, mint amilyen gyors a vízfelvétel és ez a virág lankadásához vezet.",opts:["igaz","hamis"],c:[0],type:"tf"},
{id:10,q:"Mi nem tartozik a virágkötészet feladatai közé?",opts:["belső termek, ill. környezetünk díszítése","az emberi sorsfordulók, ünnepek szebbé tétele","örömszerzés","közízlés mérséklése"],c:[3],type:"choice"},
{id:11,q:"Milyen értékek növekednek a virágkötészeti tevékenység nyomán?",opts:["pénzbeni","élvezeti","esztétikai","gasztronómiai"],c:[0,2],type:"multi",multi:true},
{id:12,q:"Melyik korban jelenik meg a virágkereskedelem és virágkötészet?",opts:["őskor","görög kor","római kor","középkor"],c:[2],type:"choice"},
{id:13,q:"Mi az ikebana?",opts:["tajvani virágrendezés művészete","japán virágrendezés művészete","kínai virágrendezés művészete","koreai virágrendezés művészete"],c:[1],type:"choice"},
{id:14,q:"Hová helyezzük el a hidegtűrő növényeket?",opts:["nyáron a kirakatba, télen az üzlet belsejébe","nyáron az üzlet belsejébe, télen a kirakatba","mindig az üzlet belsejébe","mindig a kirakatba","éjjel hűvös raktárba, nappal a kirakatba"],c:[1],type:"choice"},
{id:15,q:"Hogyan kell öntözni a nagyon lankadt növényeket?",opts:["alulról öntözés","a cserép beáztatása","a növény tölcsérébe víz töltése","felülről, a talajt öntözve","a levelek vízzel való permetezése"],c:[1],type:"choice"},
{id:16,q:"Mely eszközöket használjuk a vágott virágok kezeléséhez?",opts:["kés","olló","metszőolló","ragasztópisztoly"],c:[0,2],type:"multi",multi:true},
{id:17,q:"Melyik anyagcsoportba tartozik a celofán (kristályfólia)?",opts:["virágtartók","díszítőanyagok","rögzítőanyagok","csomagolóanyagok","kötözőanyagok","vegyi anyagok"],c:[3],type:"choice"},
{id:18,q:"Melyik nem mérgező növény?",opts:["kroton","fehér fagyöngy","fikuszok","vörösfenyő"],c:[3],type:"choice"},
{id:19,q:"Milyen átmérőjű drótot használ a virágkötészet a szegfű szárának megerősítésére?",opts:["0,3 - 0,4 mm","0,4 - 0,8 mm","0,8 - 1,0 mm","1,0 - 1,2 mm","1,2 - 1,8 mm"],c:[2],type:"choice"},
{id:20,q:"Mire nem használható a kötészolló?",opts:["virágszárak elvágására","drótozott virágszál elvágására","papír, szalag vágására","tűzhöz darabolására"],c:[3],type:"choice"},
{id:21,q:"Melyik stílusirányzat köthető Moritz Evers virágkötő nevéhez?",opts:["dekoratív","vegetatív","vonalas-grafikus","paralel"],c:[1],type:"choice"},
{id:22,q:"Az alábbiak közül melyek nem tartoznak a fölfelé törő mozgásformába?",opts:["bambusz szára","kardvirág","nárcisz","bimbós virágok"],c:[2],type:"choice"},
{id:23,q:"Jellemzően melyik mozgásformához tartozik a kövirózsa?",opts:["lefelé hajló","gyűjtő","játékos","törékeny"],c:[1],type:"choice"},
{id:24,q:"Melyik alapformára jellemző: A tökéletességet jelképezi.",opts:["kör","háromszög","négyszög","szív"],c:[1],type:"choice",note:"Képen háromszög jelölve"},
{id:25,q:"Melyik karakterformához tartozik a papagájvirág?",opts:["uralkodó","pompás","nemes","mutatós","egyszerű"],c:[0],type:"choice"},
{id:26,q:"Milyen felülete van a szárazvirágoknak?",opts:["fémes","porcelánszerű","selymes","bársonyos","rusztikus"],c:[4],type:"choice"},
{id:27,q:"Mivel nem képezhetünk súlypontot?",opts:["tömeggel","színnel","súllyal"],c:[2],type:"choice"},
{id:28,q:"Általában hol van a készítményben az esztétikai súlypont?",opts:["az alsó harmadban","a felső harmadban","a közepén","az alján"],c:[0],type:"choice"},
{id:29,q:"A tűzött virágtálnál figyelembe kell-e venni a biológiai törvényeket?",opts:["igény-törvényt","tartóssági-törvényt","táj-törvényt","évszak-törvényt","nem kell figyelembe venni"],c:[1],type:"choice"},
{id:30,q:"Melyik két megállapítás igaz az aranymetszés szabályára?",opts:["A rövidebb rész úgy aránylik a hosszabbhoz, mint a hosszabb az egészhez.","A nagyobb rész úgy aránylik a kisebbhez, mint a hosszabb az egészhez.","A kisebb rész úgy aránylik az egészhez, mint a hosszabb az egészhez.","Az emberi felsőtest úgy aránylik az alsótesthez, mint az alsótest az egész testhez.","Az emberi alsótest úgy aránylik a felsőtesthez, mint alsótest az egész testhez."],c:[0,3],type:"multi",multi:true},
{id:31,q:"Mely megállapítás igaz a fehér színre?",opts:["elsőrendű (tiszta) szín","másodrendű (kevert) szín","meleg szín","hideg szín","nem színes szín (akromatikus)"],c:[4],type:"choice"},
{id:32,q:"Mely megállapítások igazak a vörös színre?",opts:["elsőrendű (tiszta) szín","másodrendű (kevert) szín","meleg szín","hideg szín","nem színes szín (akromatikus)"],c:[0,2],type:"multi",multi:true},
{id:33,q:"Mely színek alkalmasak háttér képzésére?",opts:["vörös","zöld","sárga","kék","narancs"],c:[1,3],type:"multi",multi:true},
{id:34,q:"Mely színnel képezi a legerősebb kontrasztot a fekete?",opts:["fehér","sárga","narancs","vörös"],c:[0],type:"choice"},
{id:35,q:"Mely színre jellemző a megállapítás? Semleges, egyhangú szín.",opts:["szürke","kék","sárga","zöld"],c:[0],type:"choice"},
{id:36,q:"Melyik évszakra jellemző az alábbi színösszeállítás? Élénk, tarka, meleg színek és árnyalatok.",opts:["tavasz","nyár","ősz","tél"],c:[1],type:"choice"},
{id:37,q:"Melyik színárnyalatra jellemző a megállapítás? A derült égbolt színe, a szabadságvágy, végtelenség, lebegés jelképe.",opts:["türkizkék","világoskék","sötétkék"],c:[1],type:"choice"},
{id:38,q:"Melyik színnek nagyobb a világítóereje: a vörösnek vagy a zöldnek?",opts:["az elsőé a nagyobb","a másodiké a nagyobb","mindkettő egyforma"],c:[2],type:"choice"},
{id:39,q:"Melyik szín szimbolizálja a gyászt?",opts:["zöld","fekete","kék","sárga"],c:[1],type:"choice"},
{id:40,q:"Általában hol van a készítményben az esztétikai súlypont?",opts:["az alsó harmadban","a felső harmadban","a közepén","az alján"],c:[0],type:"choice"}
];

const ECON_QUESTIONS=[
{id:1,q:"Az egyéni vállalkozó anyagi felelőssége a vállalkozás tartozásaiért",opts:["korlátolt.","korlátlan.","korlátlan és egyetemleges."],c:[1],type:"choice"},

function getBank(mod){return mod===1?FLOWER_QUESTIONS:ECON_QUESTIONS;}

function switchModule(n){
document.getElementById('mod1').classList.add('hidden');
document.getElementById('mod2').classList.add('hidden');
document.getElementById('mod3').classList.add('hidden');
const m4=document.getElementById('mod4'); if(m4) m4.classList.add('hidden');
document.getElementById('mod'+n).classList.remove('hidden');
['btn-m1','btn-m2','btn-m3','btn-m4'].forEach((id,i)=>{
const el=document.getElementById(id);
if(i+1===n)el.className='tab-active px-5 py-3 rounded-xl text-sm font-semibold';
else el.className='px-5 py-3 rounded-xl text-sm font-semibold bg-white/10 hover:bg-white/20 text-white';
});
if(n===1)renderList(1);
if(n===2)renderList(2);
}
function switchInner(mod,which){
const list=document.getElementById('viewList'+mod);
const prac=document.getElementById('viewPractice'+mod);
const bL=document.getElementById('m'+mod+'ListBtn');
const bP=document.getElementById('m'+mod+'PracBtn');
if(which==='list'){list.classList.remove('hidden');prac.classList.add('hidden');bL.className='px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white';bP.className='px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600 hover:bg-zinc-50';}
else{list.classList.add('hidden');prac.classList.remove('hidden');bP.className='px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white';bL.className='px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600 hover:bg-zinc-50';if(!practiceState[mod].started)initPractice(mod);}
}
function renderList(mod){
const bank=getBank(mod);
const q=document.getElementById('searchInput'+mod).value.toLowerCase();
const f=document.getElementById('filterType'+mod).value;
const container=document.getElementById('questionList'+mod);
container.innerHTML='';
bank.filter(item=>{
const matchQ=item.q.toLowerCase().includes(q)||item.opts.join(' ').toLowerCase().includes(q);
let matchF=true;
if(f==='choice')matchF=item.type==='choice'&&!item.multi;
else if(f==='tf')matchF=item.type==='tf';
else if(f==='multi')matchF=item.multi;
return matchQ&&matchF;
}).forEach(item=>{
const div=document.createElement('div');
div.className='bg-white rounded-2xl border border-zinc-200 p-5 shadow-sm';
const corrects=item.c.map(i=>item.opts[i]).join(', ');
div.innerHTML=`<div class="flex gap-3"><span class="text-xs font-bold bg-[#2D3A2E] text-white w-7 h-7 flex items-center justify-center rounded-full shrink-0">${item.id}</span><div class="flex-1"><p class="font-semibold leading-snug">${item.q} ${item.multi?'<span class="text-[10px] bg-amber-100 border border-amber-200 px-2 py-0.5 rounded-full ml-2">több jó válasz</span>':''}</p><div class="mt-3 grid gap-2">${item.opts.map((o,i)=>`<div class="px-3 py-2.5 rounded-xl text-[13px] border ${item.c.includes(i)?'bg-green-50 border-green-300 text-green-800 font-semibold':'bg-zinc-50 border-zinc-100 text-zinc-700'}">${item.c.includes(i)?'✅ ':''}${o}</div>`).join('')}</div>${item.note?`<p class="mt-2 text-xs text-zinc-500 italic">${item.note}</p>`:''}</div></div>`;
container.appendChild(div);
});
}

// Practice logic per module
const practiceState={1:{order:[],idx:0,score:0,started:false},2:{order:[],idx:0,score:0,started:false}};
function initPractice(mod){const bank=getBank(mod);practiceState[mod].order=[...bank].sort(()=>Math.random()-0.5);practiceState[mod].idx=0;practiceState[mod].score=0;practiceState[mod].started=true;showPractice(mod);}
function resetPractice(mod){initPractice(mod);}
function showPractice(mod){
const st=practiceState[mod];
const item=st.order[st.idx];
document.getElementById('pProgressText'+mod).textContent=`${st.idx+1} / ${st.order.length}`;
document.getElementById('pBar'+mod).style.width=((st.idx+1)/st.order.length*100)+'%';
document.getElementById('pScore'+mod).textContent=`${st.score}`;
document.getElementById('pPerc'+mod).textContent=`${st.order.length?Math.round(st.score/(st.idx||1)*100):0}%`;
document.getElementById('pQuestion'+mod).innerHTML=`${item.id}. ${item.q} ${item.multi?'<span class="text-xs bg-amber-100 border border-amber-200 px-2 py-1 rounded-full">több jó válasz lehetséges – válassz mindet!</span>':''}`;
const optDiv=document.getElementById('pOptions'+mod);optDiv.innerHTML='';
document.getElementById('pFeedback'+mod).classList.add('hidden');
document.getElementById('pNext'+mod).classList.add('hidden');
// For multi we need checkboxes
if(item.multi){
item.opts.forEach((o,i)=>{
const label=document.createElement('label');
label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-zinc-50 hover:bg-white border-zinc-200 text-sm cursor-pointer';
label.innerHTML=`<input type="checkbox" value="${i}" class="rounded"> <span>${o}</span>`;
optDiv.appendChild(label);
});
const btn=document.createElement('button');
btn.textContent='Ellenőrzés';
btn.className='mt-3 bg-[#2D3A2E] text-white px-5 py-2 rounded-full text-sm';
btn.onclick=()=>checkMulti(mod);
optDiv.appendChild(btn);
}else{
item.opts.forEach((o,i)=>{
const b=document.createElement('button');
b.className='text-left px-4 py-3 rounded-xl border bg-zinc-50 hover:bg-white border-zinc-200 text-sm transition w-full';
b.textContent=o;
b.onclick=()=>checkPractice(mod,i);
optDiv.appendChild(b);
});
}
}
function checkPractice(mod,chosen){
const st=practiceState[mod];
const item=st.order[st.idx];
const fb=document.getElementById('pFeedback'+mod);
const buttons=document.getElementById('pOptions'+mod).children;
for(let i=0;i<item.opts.length;i++){if(buttons[i]){buttons[i].disabled=true;if(item.c.includes(i))buttons[i].className='text-left px-4 py-3 rounded-xl border bg-green-50 border-green-400 text-green-800 font-semibold text-sm w-full';else if(i===chosen)buttons[i].className='text-left px-4 py-3 rounded-xl border bg-red-50 border-red-300 text-red-700 text-sm w-full';}}
if(item.c.includes(chosen)){st.score++;fb.className='mt-6 p-4 rounded-2xl bg-green-50 border border-green-200 text-green-800 text-sm';fb.innerHTML='🎉 Helyes!';}
else{fb.className='mt-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 text-sm';fb.innerHTML=`❌ Helytelen. Helyes: <b>${item.c.map(i=>item.opts[i]).join(', ')}</b>`;}
fb.classList.remove('hidden');document.getElementById('pScore'+mod).textContent=`${st.score}`;document.getElementById('pNext'+mod).classList.remove('hidden');
}
function checkMulti(mod){
const st=practiceState[mod];
const item=st.order[st.idx];
const checkboxes=[...document.querySelectorAll('#pOptions'+mod+' input[type=checkbox]:checked')].map(cb=>parseInt(cb.value));
const fb=document.getElementById('pFeedback'+mod);
const correct=checkboxes.length===item.c.length && checkboxes.every(v=>item.c.includes(v));
if(correct)st.score++;
// show correct
const optDiv=document.getElementById('pOptions'+mod);
[...optDiv.querySelectorAll('label')].forEach((label,idx)=>{
const i=parseInt(label.querySelector('input').value);
if(item.c.includes(i))label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-green-50 border-green-400 text-green-800 font-semibold text-sm';
else if(checkboxes.includes(i))label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-red-50 border-red-300 text-red-700 text-sm';
});
fb.className=correct?'mt-6 p-4 rounded-2xl bg-green-50 border border-green-200 text-green-800 text-sm':'mt-6 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 text-sm';
fb.innerHTML=correct?'🎉 Helyes!':`❌ Helytelen. Helyes: <b>${item.c.map(i=>item.opts[i]).join(', ')}</b>`;
fb.classList.remove('hidden');
document.getElementById('pScore'+mod).textContent=`${st.score}`;
document.getElementById('pNext'+mod).classList.remove('hidden');
}
function nextPractice(mod){const st=practiceState[mod];st.idx++;if(st.idx>=st.order.length){alert(`Vége! ${st.score}/${st.order.length} pont (${Math.round(st.score/st.order.length*100)}%)`);resetPractice(mod);return;}showPractice(mod);}

// Exam combined
let eOrder=[],eIdx=0,eScore=0,eAnswers=[];
function startExam(type){
let pool=[];
if(type==='flower')pool=[...FLOWER_QUESTIONS];
else if(type==='econ')pool=[...ECON_QUESTIONS];
else pool=[...FLOWER_QUESTIONS,...ECON_QUESTIONS];
const count=type==='all'?25:20;
eOrder=pool.sort(()=>Math.random()-0.5).slice(0,count);
eIdx=0;eScore=0;eAnswers=[];
document.getElementById('examStart').classList.add('hidden');
document.getElementById('examResult').classList.add('hidden');
document.getElementById('examRunning').classList.remove('hidden');
showExam();
}
function showExam(){
const item=eOrder[eIdx];
document.getElementById('eProgress').textContent=`${eIdx+1} / ${eOrder.length}`;
document.getElementById('eScore').textContent=`Pont: ${eScore}`;
document.getElementById('eQuestion').innerHTML=`${item.q} ${item.multi?'<span class="text-xs bg-amber-100 px-2 py-1 rounded-full border">több jó</span>':''}`;
const optDiv=document.getElementById('eOptions');optDiv.innerHTML='';
document.getElementById('eFeedback').classList.add('hidden');
document.getElementById('eNext').classList.add('hidden');
if(item.multi){
item.opts.forEach((o,i)=>{
const label=document.createElement('label');
label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-zinc-50 hover:bg-white border-zinc-200 text-sm cursor-pointer w-full';
label.innerHTML=`<input type="checkbox" value="${i}" class="rounded"> <span>${o}</span>`;
optDiv.appendChild(label);
});
const btn=document.createElement('button');
btn.textContent='Ellenőrzés';
btn.className='mt-3 bg-[#2D3A2E] text-white px-5 py-2 rounded-full text-sm';
btn.onclick=()=>checkExamMulti();
optDiv.appendChild(btn);
}else{
item.opts.forEach((o,i)=>{
const b=document.createElement('button');
b.className='text-left px-4 py-3 rounded-xl border bg-zinc-50 hover:bg-white border-zinc-200 text-sm w-full';
b.textContent=o;
b.onclick=()=>checkExam(i);
optDiv.appendChild(b);
});
}
}
function checkExam(chosen){
const item=eOrder[eIdx];
const fb=document.getElementById('eFeedback');
const buttons=document.getElementById('eOptions').children;
let correct=item.c.includes(chosen);
if(correct)eScore++;
eAnswers.push({item,chosen:[chosen],correct});
for(let i=0;i<item.opts.length;i++){if(buttons[i]){buttons[i].disabled=true;if(item.c.includes(i))buttons[i].className='text-left px-4 py-3 rounded-xl border bg-green-50 border-green-400 text-green-800 font-semibold text-sm w-full';else if(i===chosen&&!correct)buttons[i].className='text-left px-4 py-3 rounded-xl border bg-red-50 border-red-300 text-red-700 text-sm w-full';}}
fb.className=correct?'mt-4 p-4 rounded-2xl bg-green-50 border border-green-200 text-green-800 text-sm':'mt-4 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 text-sm';
fb.textContent=correct?'Helyes!':`Helytelen. Helyes: ${item.c.map(i=>item.opts[i]).join(', ')}`;
fb.classList.remove('hidden');document.getElementById('eScore').textContent=`Pont: ${eScore}`;document.getElementById('eNext').classList.remove('hidden');document.getElementById('eNext').textContent=eIdx===eOrder.length-1?'Eredmény':'Következő';
}
function checkExamMulti(){
const item=eOrder[eIdx];
const checkboxes=[...document.querySelectorAll('#eOptions input[type=checkbox]:checked')].map(cb=>parseInt(cb.value));
const fb=document.getElementById('eFeedback');
const correct=checkboxes.length===item.c.length && checkboxes.every(v=>item.c.includes(v));
if(correct)eScore++;
eAnswers.push({item,chosen:checkboxes,correct});
const labels=[...document.querySelectorAll('#eOptions label')];
labels.forEach((label,idx)=>{
const v=parseInt(label.querySelector('input').value);
if(item.c.includes(v))label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-green-50 border-green-400 text-green-800 font-semibold text-sm w-full';
else if(checkboxes.includes(v))label.className='flex gap-3 items-center px-4 py-3 rounded-xl border bg-red-50 border-red-300 text-red-700 text-sm w-full';
});
fb.className=correct?'mt-4 p-4 rounded-2xl bg-green-50 border border-green-200 text-green-800 text-sm':'mt-4 p-4 rounded-2xl bg-red-50 border border-red-200 text-red-800 text-sm';
fb.textContent=correct?'Helyes!':`Helytelen. Helyes: ${item.c.map(i=>item.opts[i]).join(', ')}`;
fb.classList.remove('hidden');document.getElementById('eScore').textContent=`Pont: ${eScore}`;document.getElementById('eNext').classList.remove('hidden');document.getElementById('eNext').textContent=eIdx===eOrder.length-1?'Eredmény':'Következő';
}
function nextExam(){eIdx++;if(eIdx>=eOrder.length){showExamResult();return;}showExam();}
function showExamResult(){
document.getElementById('examRunning').classList.add('hidden');
const res=document.getElementById('examResult');res.classList.remove('hidden');
const perc=Math.round(eScore/eOrder.length*100);
document.getElementById('eResultTitle').textContent=perc>=80?'🎉 Sikeres vizsga!':'😕 Még gyakorolj!';

let q2025Order=[], q2025Idx=0, q2025Score=0, q2025Started=false, q2025Answers=[], q2025Selected=[];

function switchInner2025(which){
 document.getElementById('m4viewList').classList.toggle('hidden', which!=='list');
 document.getElementById('m4viewPractice').classList.toggle('hidden', which!=='practice');
 document.getElementById('m4ListBtn').className = which==='list' ? 'px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white' : 'px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600';
 document.getElementById('m4PracBtn').className = which==='practice' ? 'px-5 py-2.5 rounded-full text-sm font-semibold bg-[#2D3A2E] text-white' : 'px-5 py-2.5 rounded-full text-sm font-semibold text-zinc-600';
 if(which==='list') render2025List();
 if(which==='practice' && !q2025Started) init2025();
}
function render2025List(){
 const cont=document.getElementById('m4questionList');
 cont.innerHTML='';
 QUESTIONS_2025.forEach(item=>{
  const img = item.imgKey ? IMG_2025[item.imgKey] : '';
  const div=document.createElement('div');
  div.className='bg-white rounded-2xl border p-5 shadow-sm';
  div.innerHTML=`<div class="flex gap-3"><span class="w-7 h-7 rounded-full bg-[#2D3A2E] text-white text-xs font-bold flex items-center justify-center shrink-0">${item.id}</span><div class="flex-1"><p class="font-semibold text-[14px]">${item.q}</p>${img?`<img src="${img}" class="mt-3 rounded-xl border max-h-64 object-contain bg-zinc-50 w-full">`:''}<div class="mt-3 grid gap-2">${item.opts.map((o,i)=>`<div class="px-3 py-2.5 rounded-xl text-[13px] border ${item.c.includes(i)?'bg-green-50 border-green-300 text-green-800 font-semibold':'bg-zinc-50 border-zinc-100'}">${item.c.includes(i)?'✅ ':''}${o}</div>`).join('')}</div></div></div>`;
  cont.appendChild(div);
 });
}
function init2025(){
 q2025Order=[...QUESTIONS_2025].sort((a,b)=>a.id-b.id); // sorban 1-től 74-ig
 q2025Idx=0; q2025Score=0; q2025Started=true; q2025Answers=[];
 document.getElementById('m4result').classList.add('hidden');
 show2025();
}
function reset2025(){init2025();}

function show2025(){
 const item=q2025Order[q2025Idx];
 document.getElementById('m4pText').textContent=`${q2025Idx+1} / ${q2025Order.length}`;
 document.getElementById('m4pBar').style.width=((q2025Idx+1)/q2025Order.length*100)+'%';
 document.getElementById('m4pScore').textContent=`${q2025Answers.length} válasz`;
 document.getElementById('m4pPerc').textContent=`${Math.round((q2025Idx/q2025Order.length)*100)}%`;
 document.getElementById('m4pQuestion').textContent=`${item.id}. ${item.q}`;
 const imgDiv=document.getElementById('m4pImage');
 imgDiv.innerHTML = item.imgKey && IMG_2025[item.imgKey] ? `<img src="${IMG_2025[item.imgKey]}" class="rounded-2xl border max-h-80 w-full object-contain bg-zinc-50">` : '';
 const optDiv=document.getElementById('m4pOptions');
 optDiv.innerHTML='';
 document.getElementById('m4pFeedback').classList.add('hidden');
 document.getElementById('m4pNext').classList.add('hidden');
 q2025Selected=[];
 // restore previous answer if any
 const prev = q2025Answers.find(a=>a.item.id===item.id);
 if(prev) q2025Selected = prev.chosen;
 
 item.opts.forEach((o,i)=>{
  const isSel = prev && prev.chosen.includes(i);
  const b=document.createElement('button');
  b.className = isSel ? 'text-left px-4 py-3 rounded-xl border bg-amber-50 border-amber-300 text-amber-900 font-semibold text-sm' : 'text-left px-4 py-3 rounded-xl border bg-white hover:bg-zinc-50 border-zinc-200 text-sm';
  b.textContent=o;
  b.onclick=()=>{
    q2025Selected=[i];
    // highlight
    [...optDiv.children].forEach(ch=>ch.className='text-left px-4 py-3 rounded-xl border bg-white hover:bg-zinc-50 border-zinc-200 text-sm');
    b.className='text-left px-4 py-3 rounded-xl border bg-amber-50 border-amber-300 text-amber-900 font-semibold text-sm';
    save2025Answer();
  };
  optDiv.appendChild(b);
 });
 if(q2025Selected.length>0) document.getElementById('m4pNext').classList.remove('hidden');
}
function save2025Answer(){
 if(q2025Selected.length===0) return;
 const item=q2025Order[q2025Idx];
 const existingIdx = q2025Answers.findIndex(a=>a.item.id===item.id);
 const correct = item.c.includes(q2025Selected[0]);
 if(existingIdx>=0){ q2025Answers[existingIdx]={item, chosen:q2025Selected, correct}; }
 else { q2025Answers.push({item, chosen:q2025Selected, correct}); }
 if(correct && !q2025Answers[existingIdx]?.counted){ /* score will be calculated at end */ }
 document.getElementById('m4pScore').textContent=`${q2025Answers.length} válasz`;
 document.getElementById('m4pNext').classList.remove('hidden');
 document.getElementById('m4pNext').textContent = q2025Idx===q2025Order.length-1 ? 'Kiértékelés →' : 'Következő →';
}
function check2025(){ save2025Answer(); }
function next2025(){
 if(q2025Selected.length===0 && !q2025Answers.find(a=>a.item.id===q2025Order[q2025Idx].id)){ alert('Válassz egy választ!'); return; }
 q2025Idx++;
 if(q2025Idx>=q2025Order.length){ show2025Result(); return; }
 show2025();
}
function show2025Result(){
 const total = q2025Order.length;
 const correctCount = q2025Answers.filter(a=>a.correct).length;
 document.querySelector('#m4viewPractice > div:first-child').classList.add('hidden');
 document.getElementById('m4viewPractice').classList.add('hidden');
 const res=document.getElementById('m4result');
 res.classList.remove('hidden');
 const perc=Math.round(correctCount/total*100);
 document.getElementById('m4ResultTitle').textContent = perc>=80 ? '🎉 Sikeres 2025 vizsga!' : (perc>=50 ? '🙂 Közepes eredmény' : '😕 Gyakorolj még!');
 document.getElementById('m4ResultTitle').className = perc>=80 ? 'font-display text-3xl text-green-700' : 'font-display text-3xl text-amber-700';
 document.getElementById('m4ResultText').innerHTML = `<b>${correctCount} / ${total}</b> helyes (${perc}%)<br><span class="text-xs text-zinc-500">Az összes kérdésre válaszoltál, most látod a részletes kiértékelést.</span>`;
 document.getElementById('m4ResultDetails').innerHTML = q2025Order.map((origItem)=>{
   const ans = q2025Answers.find(a=>a.item.id===origItem.id);
   const chosen = ans ? ans.chosen.map(i=>origItem.opts[i]).join(', ') : '-';
   const isCorrect = ans ? ans.correct : false;
   return `<div class="p-3 rounded-xl border ${isCorrect?'bg-green-50 border-green-200':'bg-red-50 border-red-200'} text-[13px]"><p class="font-semibold">${origItem.id}. ${origItem.q}</p>${origItem.imgKey && IMG_2025[origItem.imgKey] ? `<img src="${IMG_2025[origItem.imgKey]}" class="mt-2 rounded-lg border max-h-32 object-contain bg-white">` : ''}<p class="mt-2">Te válaszod: <b>${chosen}</b> ${isCorrect?'✅':'❌'}</p>${!isCorrect?`<p class="text-green-800 mt-1">Helyes: ${origItem.c.map(i=>origItem.opts[i]).join(', ')}</p>`:''}</div>`;
 }).join('');
}


</script>
</body>
</html>
